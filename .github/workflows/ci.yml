# Every push and pull request: lint, types and tests; the plugin validated
# and tested with Claude Code's own CLI; the installer built, installed on a
# clean runner and driven end to end; and an installed version updated to a
# newer one from a local feed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Lint, types and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:legacy
      - run: npm run test:unit
      - name: No personal paths or addresses in the tree
        run: node scripts/check-personal.mjs

  plugin:
    name: Plugin (claude plugin validate and test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.295
      - run: node scripts/plugin.mjs validate
      - run: node scripts/plugin.mjs test

  package:
    name: Installer, clean install and end-to-end
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The same build as a release, except that Playwright may attach to it
      # (the inspector fuse is off in releases).
      - name: Build the installer and the portable
        run: npm run dist -- -c.electronFuses.enableNodeCliInspectArguments=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: End to end on the packaged app
        env:
          OFICINA_E2E_EXE: ${{ github.workspace }}\release\win-unpacked\Oficina de agentes.exe
        run: npx playwright test app.spec.ts

      - name: Install as a newcomer would (per user, silent)
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'Oficina-de-agentes-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\oficina-de-agentes\Oficina de agentes.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Not installed at $exe" }
          # The installer starts the app: it is closed so the tests start their own.
          Get-Process -Name 'Oficina de agentes' -ErrorAction SilentlyContinue | Stop-Process -Force
          "INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: End to end on the installed app
        env:
          OFICINA_E2E_EXE: ${{ env.INSTALLED_EXE }}
        run: npx playwright test app.spec.ts

      - name: Uninstall
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs\oficina-de-agentes') -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path -LiteralPath $env:INSTALLED_EXE) { throw 'Still installed after uninstalling' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-package
          path: |
            playwright-report
            test-results
          retention-days: 7

  update:
    name: An installed version updates itself
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build this version, then a newer one for the feed
        shell: pwsh
        run: |
          npm run icon
          npm run build
          # Test builds: Playwright may attach, and the app honours a local feed.
          $test = @('-c.electronFuses.enableNodeCliInspectArguments=true', '-c.extraMetadata.oficinaTestBuild=true')
          npx electron-builder --win nsis --publish never -c.directories.output=release-old @test
          npx electron-builder --win nsis --publish never -c.directories.output=feed -c.extraMetadata.version=99.0.0 @test
      - name: Install the older one
        shell: pwsh
        run: |
          $setup = Get-ChildItem release-old -Filter 'Oficina-de-agentes-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          Get-Process -Name 'Oficina de agentes' -ErrorAction SilentlyContinue | Stop-Process -Force
          "INSTALLED_EXE=$(Join-Path $env:LOCALAPPDATA 'Programs\oficina-de-agentes\Oficina de agentes.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Serve the newer one and update to it
        shell: pwsh
        env:
          OFICINA_E2E: '1'
          OFICINA_UPDATE_URL: http://127.0.0.1:8765/
          OFICINA_E2E_NEXT_VERSION: 99.0.0
        run: |
          $server = Start-Process -FilePath node -ArgumentList 'scripts/serve-feed.mjs','feed','8765' -PassThru -NoNewWindow
          try {
            $env:OFICINA_E2E_EXE = $env:INSTALLED_EXE
            npx playwright test update.spec.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Get-Process -Name 'Oficina de agentes' -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-update
          path: |
            playwright-report
            test-results
          retention-days: 7
